<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Krish Savaliya Portfolio</title>
  <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center brand-badge mb-3" style="width: 52px; height: 52px; font-size: 1.4rem;">
        KS
      </div>
      <h3 class="fw-bold text-dark mb-1">Portfolio Admin</h3>
      <p class="text-muted small">Sign in to manage portfolio content & settings</p>
    </div>

    <!-- Quick Demo Autofill Alert -->
    <div class="alert alert-warning border-0 d-flex align-items-start gap-2 py-2 px-3 mb-4 rounded-3 small">
      <i class="bi bi-info-circle-fill text-warning mt-1"></i>
      <div>
        <strong>Demo Credentials:</strong><br>
        Email: <code>admin@example.com</code><br>
        Password: <code>admin123</code>
        <div class="mt-2">
          <button type="button" class="btn btn-sm btn-outline-dark py-0 px-2 rounded-2" id="autofillDemoBtn">
            <i class="bi bi-magic me-1"></i> Autofill Demo
          </button>
        </div>
      </div>
    </div>

    <div id="loginAlertPlaceholder"></div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="emailInput" class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control border-start-0 ps-0" id="emailInput" placeholder="name@example.com" required>
        </div>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label for="passwordInput" class="form-label mb-0">Password</label>
          <span class="text-muted small">Default: admin123</span>
        </div>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control border-start-0 ps-0" id="passwordInput" placeholder="••••••••" required>
          <button class="btn btn-outline-secondary border-start-0 border" type="button" id="togglePasswordBtn">
            <i class="bi bi-eye" id="togglePasswordIcon"></i>
          </button>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMeCheckbox" checked>
          <label class="form-check-label small text-muted" for="rememberMeCheckbox">Remember me</label>
        </div>
      </div>

      <button type="submit" class="btn btn-admin-primary w-100 py-2 d-flex align-items-center justify-content-center gap-2">
        <i class="bi bi-box-arrow-in-right"></i>
        <span>Sign In to Dashboard</span>
      </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top">
      <a href="../index.html" class="text-decoration-none small text-muted d-inline-flex align-items-center gap-1">
        <i class="bi bi-arrow-left"></i> Return to Public Portfolio
      </a>
    </div>
  </div>

  <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/portfolio-data.js"></script>
  <script src="../assets/js/portfolio-store.js"></script>
  <script src="../assets/js/admin.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Check if already authenticated
      if (PortfolioStore.isAdminLoggedIn()) {
        window.location.href = "index.html";
        return;
      }

      const form = document.getElementById("loginForm");
      const emailInput = document.getElementById("emailInput");
      const passwordInput = document.getElementById("passwordInput");
      const rememberCheckbox = document.getElementById("rememberMeCheckbox");
      const autofillBtn = document.getElementById("autofillDemoBtn");
      const togglePasswordBtn = document.getElementById("togglePasswordBtn");
      const togglePasswordIcon = document.getElementById("togglePasswordIcon");
      const alertPlaceholder = document.getElementById("loginAlertPlaceholder");

      // Autofill demo button
      autofillBtn.addEventListener("click", () => {
        emailInput.value = "admin@example.com";
        passwordInput.value = "admin123";
        emailInput.focus();
      });

      // Toggle password visibility
      togglePasswordBtn.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        togglePasswordIcon.className = isPassword ? "bi bi-eye-slash" : "bi bi-eye";
      });

      // Form submission
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        alertPlaceholder.innerHTML = "";

        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const remember = rememberCheckbox.checked;

        if (!email || !password) {
          showAlert("Please enter both email and password.", "danger");
          return;
        }

        const res = PortfolioStore.login(email, password, remember);
        if (res.success) {
          showAlert("Authentication successful! Redirecting...", "success");
          setTimeout(() => {
            window.location.href = "index.html";
          }, 600);
        } else {
          showAlert(res.error, "danger");
        }
      });

      function showAlert(msg, type) {
        alertPlaceholder.innerHTML = `
          <div class="alert alert-${type} alert-dismissible fade show small py-2 px-3 rounded-3" role="alert">
            ${msg}
            <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
